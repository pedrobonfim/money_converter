<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Conversor de Moedas</title>
  <meta name="description" content="Converta valores entre suas moedas favoritas.">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Câmbio">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>Câmbio</h1>
    <div class="actions">
      <button id="btn-refresh" class="icon-btn" type="button" aria-label="Atualizar cotações" title="Atualizar cotações">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4h-4"/></svg>
      </button>
      <button id="btn-manage" class="icon-btn" type="button" aria-label="Escolher moedas" title="Escolher moedas">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <p id="status" class="status" role="status"></p>
    <ul id="list" class="list"></ul>
    <div id="empty" class="empty" hidden>
      <p>Nenhuma moeda favorita.</p>
      <button id="btn-empty-manage" class="primary-btn" type="button">Escolher moedas</button>
    </div>
    <button id="btn-clear" class="link-btn" type="button" hidden>Limpar valores</button>
  </main>

  <dialog id="manage" class="sheet" aria-labelledby="manage-title">
    <div class="sheet-head">
      <h2 id="manage-title">Moedas</h2>
      <button id="btn-close" class="link-btn" type="button">Concluir</button>
    </div>
    <input id="search" class="search" type="search" placeholder="Buscar moeda ou código" autocomplete="off">
    <ul id="all" class="all"></ul>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
